version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veridex_postgres
    restart: always
    environment:
      POSTGRES_USER: veridex_user
      POSTGRES_PASSWORD: veridex_password
      POSTGRES_DB: veridex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridex_user -d veridex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
